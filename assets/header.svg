<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="50%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.45)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.4)" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="15%" cy="35%" r="50%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.16)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="65%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.12)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0, 0, 0, 0.6)" />
    </filter>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, Helvetica, Arial, sans-serif; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .live-dot {
        animation: pulseDot 2.5s ease-in-out infinite;
        transform-origin: 820px 38px;
      }
    </style>
  </defs>

  <rect x="8" y="8" width="864" height="264" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" filter="url(#shadow)" />
  <rect x="8" y="8" width="864" height="264" rx="16" fill="url(#grid)" />
  <rect x="8" y="8" width="864" height="264" rx="16" fill="url(#glowLeft)" />
  <rect x="8" y="8" width="864" height="264" rx="16" fill="url(#glowRight)" />

  <!-- Top Glass Terminal Bar -->
  <line x1="8" y1="56" x2="872" y2="56" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="36" cy="32" r="5" fill="#ff5f56" opacity="0.85" />
  <circle cx="52" cy="32" r="5" fill="#ffbd2e" opacity="0.85" />
  <circle cx="68" cy="32" r="5" fill="#27c93f" opacity="0.85" />

  <!-- Breadcrumb -->
  <text x="96" y="36" class="mono" font-size="11" fill="#64748b" letter-spacing="0.5">DINUJAYA // EXECUTIVE_LEADERSHIP // FOUNDER &amp; CEO</text>

  <!-- Live Status -->
  <g class="live-dot">
    <circle cx="816" cy="32" r="4" fill="#10b981" />
  </g>
  <text x="705" y="36" class="mono" font-size="10.5" fill="#10b981" font-weight="600" letter-spacing="0.8">OPERATIONS ACTIVE</text>

  <!-- Main Identity Section -->
  <g transform="translate(42, 102)">
    <text x="0" y="0" class="mono" font-size="12" fill="#818cf8" font-weight="600" letter-spacing="2.5">MULTI-BUSINESS FOUNDER &amp; CEO</text>
    <text x="0" y="44" class="sans" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">DINUJAYA</text>
    <text x="0" y="74" class="sans" font-size="17" font-weight="500" fill="#94a3b8" letter-spacing="0.2">Strategic Planning • Real Estate &amp; Properties • AI Automation Systems</text>
  </g>

  <!-- Accent Divider Line -->
  <rect x="42" y="196" width="796" height="2" rx="1" fill="url(#accentLine)" opacity="0.75" />

  <!-- Bottom Specification Badges -->
  <g transform="translate(42, 232)">
    <rect x="0" y="0" width="220" height="28" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="110" y="18" text-anchor="middle" class="mono" font-size="10" fill="#cbd5e1" font-weight="600" letter-spacing="0.6">🏢 DUAL ENTERPRISES</text>

    <rect x="235" y="0" width="220" height="28" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="345" y="18" text-anchor="middle" class="mono" font-size="10" fill="#cbd5e1" font-weight="600" letter-spacing="0.6">📐 STRATEGIC PLANNING</text>

    <rect x="470" y="0" width="220" height="28" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="580" y="18" text-anchor="middle" class="mono" font-size="10" fill="#cbd5e1" font-weight="600" letter-spacing="0.6">🤖 AI AUTOMATION BOTS</text>

    <rect x="705" y="0" width="90" height="28" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <text x="750" y="18" text-anchor="middle" class="mono" font-size="10" fill="#10b981" font-weight="700" letter-spacing="0.6">CEO</text>
  </g>
</svg>