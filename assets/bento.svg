<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <linearGradient id="bentoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, Helvetica, Arial, sans-serif; }
      .label { font-size: 10px; font-weight: 700; fill: #6366f1; letter-spacing: 1.5px; }
      .h { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .desc { font-size: 12px; fill: #94a3b8; line-height: 1.6; }
      .item { font-size: 11.5px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Box 1: Multi-Business Leadership -->
  <g transform="translate(8, 8)">
    <rect width="280" height="224" rx="12" fill="url(#bentoBg)" stroke="url(#bentoBorder)" stroke-width="1.2" />
    <text x="20" y="32" class="mono label">01 // ENTERPRISE LEADERSHIP</text>
    <text x="20" y="58" class="sans h">Founder &amp; CEO (2 Companies)</text>
    <text x="20" y="80" class="sans desc">Directing dual corporate ventures spanning Property Development and Tech-Driven Automation.</text>
    
    <g transform="translate(20, 130)">
      <text x="0" y="0" class="mono item">▸ Multi-Business Governance</text>
      <text x="0" y="24" class="mono item">▸ Strategic Asset Scaling</text>
      <text x="0" y="48" class="mono item">▸ Operational P&amp;L Leadership</text>
      <text x="0" y="72" class="mono item">▸ Venture Growth &amp; Expansion</text>
    </g>
  </g>

  <!-- Box 2: Spatial & Strategic Planning -->
  <g transform="translate(298, 8)">
    <rect width="284" height="224" rx="12" fill="url(#bentoBg)" stroke="url(#bentoBorder)" stroke-width="1.2" />
    <text x="20" y="32" class="mono label">02 // STRATEGIC PLANNING</text>
    <text x="20" y="58" class="sans h">Planning &amp; Structural Vision</text>
    <text x="20" y="80" class="sans desc">Mastery in architectural house planning, structural layouts, and comprehensive masterplans.</text>

    <g transform="translate(20, 130)">
      <text x="0" y="0" class="mono item">▸ House &amp; Structural Planning</text>
      <text x="0" y="24" class="mono item">▸ Real Estate &amp; Land Projects</text>
      <text x="0" y="48" class="mono item">▸ Spatial Optimization</text>
      <text x="0" y="72" class="mono item">▸ Blueprint &amp; Execution Roadmaps</text>
    </g>
  </g>

  <!-- Box 3: AI Automation Systems -->
  <g transform="translate(592, 8)">
    <rect width="280" height="224" rx="12" fill="url(#bentoBg)" stroke="url(#bentoBorder)" stroke-width="1.2" />
    <text x="20" y="32" class="mono label">03 // AI AUTOMATION</text>
    <text x="20" y="58" class="sans h">Autonomous Bot Engines</text>
    <text x="20" y="80" class="sans desc">Architecting intelligent AI business bots, automated WhatsApp messaging, and self-operating systems.</text>

    <g transform="translate(20, 130)">
      <text x="0" y="0" class="mono item">▸ AI WhatsApp Bots &amp; Agents</text>
      <text x="0" y="24" class="mono item">▸ Zero-Touch Business Automations</text>
      <text x="0" y="48" class="mono item">▸ High-Concurrency Bot Engines</text>
      <text x="0" y="72" class="mono item">▸ Real-Time Intelligent Processing</text>
    </g>
  </g>
</svg>